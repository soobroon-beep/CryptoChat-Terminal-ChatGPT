name: Tests
on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    name: Syntax and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -r -n1 node --check
      - name: Run indicator and Pine regression tests
        run: node --test tests/indicators.test.js tests/pine.test.js tests/corpus.test.js
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright-core
          npx playwright install --with-deps chromium
      - name: Test cross-device synchronization
        run: |
          CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright-core').chromium.executablePath())")" node tests/e2e/sync-two-devices.js
